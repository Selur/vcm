name: Build wheels

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest, archs: AMD64 }
          - { name: Linux x86_64, os: ubuntu-latest, archs: x86_64 }
          - { name: macOS arm64, os: macos-14, archs: arm64 }
    steps:
      - uses: actions/checkout@v4

      # fftw3f is linked statically on every platform so the plugin has no run time dependencies.
      - name: Install fftw3 (vcpkg, static CRT)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install fftw3[avx2]:x64-windows-static
          $root = $env:VCPKG_INSTALLATION_ROOT -replace '\\', '/'
          "FFTW3_DIR=$root/installed/x64-windows-static" >> $env:GITHUB_ENV

      - name: Build fftw3 (static)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: bash ci/build-fftw.sh ${{ github.workspace }}/fftw-prefix

      - name: Build wheel
        uses: pypa/cibuildwheel@v2.21
        env:
          # The plugin only uses the VapourSynth C API, so one interpreter is enough;
          # the wheel is re-tagged to py3-none below.
          CIBW_BUILD: cp312-*
          CIBW_SKIP: '*-musllinux*'
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: ''
          # Linux: fftw is built inside the manylinux container.
          CIBW_BEFORE_ALL_LINUX: bash {project}/ci/build-fftw.sh /usr/local
          CIBW_CONFIG_SETTINGS_LINUX: setup-args=-Dprefer_static=true setup-args=-Dfftw3_dir=/usr/local
          CIBW_CONFIG_SETTINGS_MACOS: setup-args=-Dprefer_static=true setup-args=-Dfftw3_dir=${{ github.workspace }}/fftw-prefix
          # Meson would otherwise pick MinGW g++ on the runner, whose DLL needs libstdc++/libgcc
          # at load time. Build with MSVC and link the runtime statically instead (matches the
          # x64-windows-static vcpkg triplet).
          CIBW_CONFIG_SETTINGS_WINDOWS: setup-args=--vsenv setup-args=-Db_vscrt=mt setup-args=-Dprefer_static=true setup-args=-Dfftw3_dir=${{ env.FFTW3_DIR }}
          # The installed wheel is autoloaded, so the test needs no plugin path.
          CIBW_TEST_REQUIRES: numpy
          CIBW_TEST_COMMAND: python {project}/test/test_vcm.py

      - name: Re-tag wheel as Python-independent
        shell: bash
        run: |
          python -m pip install wheel
          python -m wheel tags --python-tag py3 --abi-tag none --remove wheelhouse/*.whl
          ls wheelhouse

      - name: Extract plain plugin binary
        shell: bash
        run: |
          python -m zipfile -e wheelhouse/*.whl extracted
          mkdir -p plugin
          cp extracted/vapoursynth/plugins/*vcm* plugin/
          cp -r docs plugin/
          ls -l plugin

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.os }}
          path: plugin/

  release:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          path: plugins
      - name: Zip plugin binaries
        run: |
          cd plugins
          for d in plugin-*; do (cd "$d" && zip -r "../../dist/vcm-${{ github.ref_name }}-${d#plugin-}.zip" .); done
          ls -l ../dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.zip
          generate_release_notes: true
